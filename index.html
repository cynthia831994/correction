<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多功能班級作業打卡系統（多表並排版）</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-main: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      
      /* 三態顏色 */
      --status-0-bg: #f8fafc;
      --status-0-border: #cbd5e1;
      --status-0-text: #64748b;
      
      --status-1-bg: #fef3c7;
      --status-1-border: #f59e0b;
      --status-1-text: #b45309;
      
      --status-2-bg: #dcfce7;
      --status-2-border: #22c55e;
      --status-2-text: #15803d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.5;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1e293b;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    /* 頂部設定區卡片 */
    .setting-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      max-width: 1400px;
      margin: 0 auto 20px auto;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .input-group {
      display: flex;
      gap: 10px;
      flex: 1;
      min-width: 300px;
    }

    input[type="text"], select {
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"] {
      flex: 1;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-primary { background-color: var(--primary); color: #fff; }
    .btn-primary:hover { background-color: var(--primary-hover); }

    .btn-secondary { background-color: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    .btn-secondary:hover { background-color: #e2e8f0; }

    .btn-success { background-color: #10b981; color: #fff; }
    .btn-success:hover { background-color: #059669; }

    .btn-danger { background-color: #ef4444; color: #fff; }
    .btn-danger:hover { background-color: #dc2626; }

    .btn-sm { padding: 6px 10px; font-size: 0.85rem; }

    /* 圖例說明 */
    .legend-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-box { width: 14px; height: 14px; border-radius: 3px; border: 1px solid; }

    /* 三欄並排網格容器 */
    .tables-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto 20px auto;
    }

    @media (max-width: 1100px) {
      .tables-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .tables-container {
        grid-template-columns: 1fr;
      }
    }

    /* 單張打卡表卡片 */
    .table-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #f1f5f9;
    }

    .table-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1e293b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 座號網格 */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
      gap: 8px;
      margin-bottom: 16px;
      flex: 1;
    }

    .grid-item {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1.5px solid;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease;
      padding: 4px;
    }

    .grid-item:active { transform: scale(0.92); }

    .grid-item .num { font-size: 1.05rem; font-weight: 700; line-height: 1; }
    .grid-item .status-lbl { font-size: 0.68rem; font-weight: 600; margin-top: 2px; }

    .grid-item.status-0 { background: var(--status-0-bg); border-color: var(--status-0-border); color: var(--status-0-text); }
    .grid-item.status-1 { background: var(--status-1-bg); border-color: var(--status-1-border); color: var(--status-1-text); }
    .grid-item.status-2 { background: var(--status-2-bg); border-color: var(--status-2-border); color: var(--status-2-text); }

    /* 卡片底部統計與操作 */
    .card-footer {
      border-top: 1px dashed #e2e8f0;
      padding-top: 12px;
    }

    .summary-row {
      display: flex;
      justify-content: space-around;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .empty-placeholder {
      grid-column: span 3;
      text-align: center;
      padding: 60px 20px;
      background: #ffffff;
      border-radius: 12px;
      color: var(--text-muted);
      border: 2px dashed #cbd5e1;
    }

    /* 歷史紀錄卡片 */
    .history-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      max-width: 1400px;
      margin: 0 auto;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    .history-table th, .history-table td {
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      font-size: 0.88rem;
      text-align: left;
    }

    .history-table th { background: #f8fafc; font-weight: 600; width: 110px; }

    .tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-right: 4px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>📋 班級多功能作業打卡系統</h1>
  <p>支援新增自訂主題打卡表 · 多表並排操作 · 點擊三態切換（未交 ➔ 待訂正 ➔ 已完成）</p>
</div>

<!-- 頂部控制面板 -->
<div class="setting-card">
  <div class="control-row">
    <div class="input-group">
      <input type="text" id="topicInput" placeholder="請輸入打卡主題（例如：國語第一課、數學習作）">
      <button class="btn btn-primary" onclick="addTable()">➕ 新增打卡表</button>
    </div>

    <div class="legend-bar">
      <div class="legend-item"><div class="legend-box" style="background:var(--status-0-bg); border-color:var(--status-0-border);"></div> 未按：未交</div>
      <div class="legend-item"><div class="legend-box" style="background:var(--status-1-bg); border-color:var(--status-1-border);"></div> 按 1 次：待訂正</div>
      <div class="legend-item"><div class="legend-box" style="background:var(--status-2-bg); border-color:var(--status-2-border);"></div> 按 2 次：已完成</div>
    </div>

    <div>
      <button class="btn btn-secondary" onclick="configureSeatList()">⚙️ 設定全班座號</button>
    </div>
  </div>
</div>

<!-- 三張打卡表並排區域 -->
<div class="tables-container" id="tablesContainer">
  <!-- 動態生成打卡表卡片 -->
</div>

<!-- 歷史紀錄與查詢 -->
<div class="history-card">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
    <h2 style="font-size: 1.15rem; color: #334155;">🔍 查詢過往紀錄</h2>
    <button class="btn btn-danger btn-sm" onclick="clearAllHistory()">🗑️ 清除所有歷史紀錄</button>
  </div>
  
  <div class="control-row" style="margin-bottom: 12px;">
    <select id="historySelect" onchange="loadHistoryDetail()">
      <option value="">-- 請選擇過往紀錄 --</option>
    </select>
  </div>

  <div id="historyDetail"></div>
</div>

<script>
  // 指定的預設號碼：1-8, 10-14, 21-28, 30-34
  let seatList = [
    '1','2','3','4','5','6','7','8',
    '10','11','12','13','14',
    '21','22','23','24','25','26','27','28',
    '30','31','32','33','34'
  ];
  let activeTables = [];

  const statusMap = {
    0: { label: "未交", className: "status-0" },
    1: { label: "待訂正", className: "status-1" },
    2: { label: "已完成", className: "status-2" }
  };

  window.onload = function() {
    activeTables = [
      createTableObject("國語習作 L1"),
      createTableObject("數學隨堂測驗"),
      createTableObject("聯絡簿簽名")
    ];

    renderAllTables();
    updateHistoryDropdown();
  };

  function createTableObject(topic) {
    let initialStatus = {};
    seatList.forEach(num => initialStatus[num] = 0);
    return {
      id: Date.now() + Math.random(),
      topic: topic,
      statusData: initialStatus
    };
  }

  function addTable() {
    const input = document.getElementById('topicInput');
    const topic = input.value.trim();

    if (!topic) {
      alert("請先輸入打卡主題！");
      return;
    }

    activeTables.push(createTableObject(topic));
    input.value = "";
    renderAllTables();
  }

  function configureSeatList() {
    const input = prompt("請輸入號碼/座號清單（用逗號分隔）：", seatList.join(','));
    if (input !== null) {
      const parsed = input.split(',').map(s => s.trim()).filter(s => s !== "");
      if (parsed.length === 0) {
        alert("座號不可為空！");
        return;
      }
      seatList = parsed;

      activeTables.forEach(table => {
        let newStatus = {};
        seatList.forEach(num => {
          newStatus[num] = table.statusData[num] !== undefined ? table.statusData[num] : 0;
        });
        table.statusData = newStatus;
      });

      renderAllTables();
    }
  }

  function renderAllTables() {
    const container = document.getElementById('tablesContainer');
    container.innerHTML = "";

    if (activeTables.length === 0) {
      container.innerHTML = `
        <div class="empty-placeholder">
          <h3>目前沒有打卡表</h3>
          <p style="margin-top:6px;">請在上方輸入主題名稱，點擊「➕ 新增打卡表」開啟打卡。</p>
        </div>
      `;
      return;
    }

    activeTables.forEach((table, index) => {
      const card = document.createElement('div');
      card.className = "table-card";

      let counts = { 0: 0, 1: 0, 2: 0 };
      Object.values(table.statusData).forEach(val => counts[val] = (counts[val] || 0) + 1);

      let gridHTML = "";
      seatList.forEach(num => {
        const st = table.statusData[num] !== undefined ? table.statusData[num] : 0;
        gridHTML += `
          <div class="grid-item ${statusMap[st].className}" onclick="cycleStatus(${index}, '${num}')">
            <div class="num">${num}</div>
            <div class="status-lbl">${statusMap[st].label}</div>
          </div>
        `;
      });

      card.innerHTML = `
        <div class="table-header">
          <div class="table-title" title="${table.topic}">📍 ${table.topic}</div>
          <button class="btn btn-danger btn-sm" onclick="removeTable(${index})">✕ 刪除</button>
        </div>

        <div class="grid-container">
          ${gridHTML}
        </div>

        <div class="card-footer">
          <div class="summary-row">
            <span style="color:var(--status-0-text)">未交: ${counts[0]}</span>
            <span style="color:var(--status-1-text)">待訂正: ${counts[1]}</span>
            <span style="color:var(--status-2-text)">已完成: ${counts[2]}</span>
          </div>
          <button class="btn btn-success btn-sm" style="width:100%" onclick="saveSingleTable(${index})">💾 儲存此表紀錄</button>
        </div>
      `;

      container.appendChild(card);
    });
  }

  function cycleStatus(tableIndex, seatNum) {
    activeTables[tableIndex].statusData[seatNum] = ((activeTables[tableIndex].statusData[seatNum] || 0) + 1) % 3;
    renderAllTables();
  }

  function removeTable(index) {
    if (confirm(`確定要移除「${activeTables[index].topic}」這張打卡表嗎？`)) {
      activeTables.splice(index, 1);
      renderAllTables();
    }
  }

  function saveSingleTable(index) {
    const table = activeTables[index];
    const now = new Date();
    const timestamp = `${now.toLocaleDateString('zh-TW')} ${now.toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit', second:'2-digit'})}`;

    const record = {
      id: Date.now(),
      topic: table.topic,
      timestamp: timestamp,
      seatList: [...seatList],
      data: { ...table.statusData }
    };

    let history = JSON.parse(localStorage.getItem('multi_checkin_history') || '[]');
    history.unshift(record);
    localStorage.setItem('multi_checkin_history', JSON.stringify(history));

    alert(`✅ 已成功儲存「${table.topic}」的打卡紀錄！`);
    updateHistoryDropdown();
  }

  function updateHistoryDropdown() {
    const select = document.getElementById('historySelect');
    select.innerHTML = '<option value="">-- 請選擇過往紀錄 --</option>';

    let history = JSON.parse(localStorage.getItem('multi_checkin_history') || '[]');
    history.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.id;
      opt.innerText = `[${item.timestamp}] ${item.topic}`;
      select.appendChild(opt);
    });
  }

  function loadHistoryDetail() {
    const select = document.getElementById('historySelect');
    const recordId = select.value;
    const detailDiv = document.getElementById('historyDetail');

    if (!recordId) {
      detailDiv.innerHTML = "";
      return;
    }

    let history = JSON.parse(localStorage.getItem('multi_checkin_history') || '[]');
    const record = history.find(r => r.id == recordId);

    if (!record) return;

    let unsubmitted = [];
    let needFix = [];
    let completed = [];

    (record.seatList || Object.keys(record.data)).forEach(num => {
      const st = record.data[num];
      if (st === 0) unsubmitted.push(num);
      else if (st === 1) needFix.push(num);
      else if (st === 2) completed.push(num);
    });

    detailDiv.innerHTML = `
      <div style="background: #f8fafc; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
        <strong>📌 ${record.topic}</strong>
        <span style="font-size:0.85rem; color: var(--text-muted); margin-left: 10px;">儲存時間：${record.timestamp}</span>
      </div>
      <table class="history-table">
        <tr>
          <th style="color: var(--status-0-text);">未交 (${unsubmitted.length} 人)</th>
          <td>${unsubmitted.length ? unsubmitted.map(n => `<span class="tag" style="background:var(--status-0-bg); color:var(--status-0-text); border: 1px solid var(--status-0-border);">${n}號</span>`).join('') : '無'}</td>
        </tr>
        <tr>
          <th style="color: var(--status-1-text);">待訂正 (${needFix.length} 人)</th>
          <td>${needFix.length ? needFix.map(n => `<span class="tag" style="background:var(--status-1-bg); color:var(--status-1-text); border: 1px solid var(--status-1-border);">${n}號</span>`).join('') : '無'}</td>
        </tr>
        <tr>
          <th style="color: var(--status-2-text);">已完成 (${completed.length} 人)</th>
          <td>${completed.length ? completed.map(n => `<span class="tag" style="background:var(--status-2-bg); color:var(--status-2-text); border: 1px solid var(--status-2-border);">${n}號</span>`).join('') : '無'}</td>
        </tr>
      </table>
    `;
  }

  function clearAllHistory() {
    if (confirm("確定要清除所有過往的打卡紀錄嗎？")) {
      localStorage.removeItem('multi_checkin_history');
      updateHistoryDropdown();
      document.getElementById('historyDetail').innerHTML = "";
      alert("歷史紀錄已清空！");
    }
  }
</script>
